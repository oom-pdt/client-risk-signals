<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Client Risk Signals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: CRM shell — top bar + nav, single working column, right-hand signal drawer */
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface-2:rgba(241,245,249,.8); --line:rgba(15,23,42,.08); --line-strong:rgba(15,23,42,.18);
  --fg:#1e293b; --fg-2:#475569; --fg-3:#64748b;
  --accent:#6366f1; --accent-soft:rgba(99,102,241,.1); --accent-fg:#ffffff; --accent-ink:#4f46e5;
  --sev-severe:#dc2626; --sev-severe-bg:#fee2e2;
  --sev-high:#c2410c; --sev-high-bg:#ffedd5;
  --sev-medium:#b45309; --sev-medium-bg:#fef3c7;
  --sev-trend:#4f46e5; --sev-trend-bg:#e0e7ff;
  --sev-pos:#059669; --sev-pos-bg:#d1fae5;
  --band:rgba(99,102,241,.14); --ours:#94a3b8;
  --anno-bg:#fff7d6; --anno-fg:#5c4a00; --anno-line:#e5cf6b;
  --glass:rgba(255,255,255,.9); --glass-line:rgba(255,255,255,.75);
  --shadow:0 12px 40px rgba(15,23,42,.14);
  --font-ui:system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums;font-size:.92em}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}

/* top bar */
.spacer{flex:1}
select{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:13px}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-2)}

main{padding-block:20px 60px}
.crumbs{font-size:13px;color:var(--fg-3);margin-bottom:8px}
.crumbs button{background:none;border:0;padding:0;color:var(--accent)}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:16px}
.pagehead h1{font-size:24px;letter-spacing:-.015em}
.pagehead .sub{color:var(--fg-2);font-size:13px;display:flex;gap:6px 16px;flex-wrap:wrap}
.section{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.section > header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.section > header h2{font-size:15px}
.section .body{padding:14px 16px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:600}

/* pills and chips */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.lvl-severe{color:var(--sev-severe);background:var(--sev-severe-bg)}
.rating{font-size:12px;font-weight:600;padding:2px 9px;border-radius:4px;border:1px solid var(--line-strong);color:var(--fg-2)}
.rating.r-AtRisk{border-color:var(--sev-high);color:var(--sev-high)}
.rating.r-Critical{border-color:var(--sev-severe);color:var(--sev-severe)}
.rating.r-Healthy{border-color:var(--sev-pos);color:var(--sev-pos)}
.gap{font-size:12px;font-weight:600;color:var(--anno-fg);background:var(--anno-bg);border:1px solid var(--anno-line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.status{font-size:12px;color:var(--fg-2);white-space:nowrap}
.status.New{color:var(--accent);font-weight:600}
.src{font-size:12px;color:var(--fg-3);white-space:nowrap}

/* service strip */

/* signal rows */
.empty{padding:24px 16px;color:var(--fg-3);text-align:center}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
.acct{font-weight:600}
.acct small{display:block;font-weight:400;color:var(--fg-3);font-size:12px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left}
.tile .v{font-size:24px;font-weight:600;letter-spacing:-.01em;font-family:var(--font-data)}
.tile .l{font-size:12px;color:var(--fg-3)}
button.tile:hover{border-color:var(--line-strong)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* brief */
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0}
.brief > div{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.brief > div:last-child{border-right:0}
.brief ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.brief li button{background:none;border:0;padding:0;text-align:left;color:var(--fg);display:flex;gap:8px;align-items:baseline}
.brief li button:hover .n{text-decoration:underline}
.brief .big{font-size:22px;font-weight:600;font-family:var(--font-data)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer header h2{font-size:18px;margin-top:4px}
.drawer .x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;width:32px;height:32px;flex:none}
.drawer .scroll{overflow-y:auto;flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.drawer .foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--fg-3)} .kv dd{margin:0}
blockquote{margin:0;padding:12px 14px;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;font-size:14px}
blockquote footer{font-size:12px;color:var(--fg-3);margin-top:6px;font-style:normal}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist li{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px}
.hist .when{color:var(--fg-3);font-family:var(--font-data);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actmenu button{text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:10px 12px}
.actmenu button:hover{border-color:var(--accent)}
.actmenu button b{display:block;font-size:13px}
.actmenu button span{font-size:12px;color:var(--fg-3)}
textarea{width:100%;min-height:72px;border:1px solid var(--line-strong);border-radius:6px;padding:8px;background:var(--surface)}
.hint{font-size:12px;color:var(--fg-3)}

/* annotations */
.anno{display:block;background:var(--anno-bg);color:var(--anno-fg);border:1px solid var(--anno-line);border-radius:6px;padding:6px 10px;font-size:12px;line-height:1.4}
.anno b{font-weight:700}

/* popover legend */
.legend{font-size:13px;display:flex;flex-direction:column;gap:6px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.legend ul{margin:0;padding-left:18px}

/* chart */

/* client record */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.cols{grid-template-columns:minmax(0,1fr)}}
.idcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.idcard .top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start}
.idcard h1{font-size:24px;letter-spacing:-.015em}
.idcard .sub{color:var(--fg-2);font-size:13px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:10px 32px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.fact .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);font-weight:600}
.fact .v{font-size:14px;font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;border:1px solid var(--line-strong);color:var(--fg-2);white-space:nowrap}
.tag.st-active,.tag.ok{border-color:var(--sev-pos);color:var(--sev-pos)}
.tag.st-expired,.tag.bad{border-color:var(--sev-severe);color:var(--sev-severe)}
.tag.st-suspended,.tag.warn{border-color:var(--sev-medium);color:var(--sev-medium)}
.attn{list-style:none;margin:0;padding:0}
.attn li{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.attn li:last-child{border-bottom:0}
.attn .tx{flex:1;min-width:0}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.list li:last-child{border-bottom:0}
.list .sub2{font-size:12px;color:var(--fg-3)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .when{font-family:var(--font-data);font-size:12px;color:var(--fg-3)}
.tl .meta{font-size:12px;color:var(--fg-3);margin-top:2px}
.sigmini{display:grid;grid-template-columns:172px minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 16px}
.sigmini:hover{background:rgba(99,102,241,.05)}
.sigmini{padding-left:24px;padding-right:24px}
.sigmini:last-child{border-bottom:0}
.contract-head{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal .bg{position:absolute;inset:0;background:rgba(10,15,13,.45)}
.modal .panel{position:relative;background:var(--surface);border-radius:12px;width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow)}
.modal .panel > header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal .panel > header h2{font-size:17px}
.modal .fields{padding:16px 18px;display:grid;gap:12px}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal label.f{display:grid;gap:4px;font-size:12px;color:var(--fg-3);font-weight:600}
.modal input[type=text],.modal input[type=date],.modal select{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px}
.modal .pfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .opts{display:flex;gap:16px;flex-wrap:wrap}
@media (max-width:640px){.modal .two{grid-template-columns:1fr}.tl li{grid-template-columns:1fr}}

/* toasts / notification panel */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.pattern{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:16px}
.pattern .big{font-family:var(--font-data);font-size:22px;font-weight:600;color:var(--sev-high)}
.unattr{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:16px;padding:16px;border-bottom:1px solid var(--line)}
.unattr:last-child{border-bottom:0}

@media (max-width:640px){
  .unattr{grid-template-columns:minmax(0,1fr)}
  .actmenu{grid-template-columns:1fr}
  .brief > div{border-right:0;border-bottom:1px solid var(--line)}
  .kv{grid-template-columns:110px minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}

/* ---- Hub-style skin: soft gradient, frosted cards, pill controls (visual reference: Hub-V1) ---- */
body{background-color:#f8fafc;background-image:radial-gradient(circle at 15% 10%,#e0e7ff 0%,transparent 40%),radial-gradient(circle at 85% 30%,#f3e8ff 0%,transparent 45%),radial-gradient(circle at 50% 90%,#fae8ff 0%,transparent 50%);background-attachment:fixed;min-height:100vh;font-size:14px}
.num{font-family:var(--font-ui);font-size:1em;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.9em}
select{border-radius:12px;background:#fff;border:1px solid var(--line)}
main{padding-block:28px 72px}
.section,.idcard,.tile,.pattern{background:var(--glass);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid var(--glass-line);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.04),0 2px 12px rgba(0,0,0,.02)}
.section{overflow:hidden;margin-bottom:20px}
.section > header{border-bottom:0;padding:20px 24px 10px}
.section > header h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.idcard{padding:24px 28px;margin-bottom:20px}
.idcard h1{font-size:26px;font-weight:700}
.facts{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.fact .v{font-size:18px;font-weight:700}
.fact .l,.eyebrow{font-weight:700;letter-spacing:.5px}
.contract-head{background:rgba(99,102,241,.06);border-bottom:0;padding:14px 24px}
/* segmented pill tabs */
.chip{border-radius:999px}
/* buttons */
.btn{border-radius:12px;border:1px solid var(--line-strong);background:#fff;font-weight:600;padding:8px 16px}
.btn.sm{padding:4px 12px;border-radius:10px}
.btn:hover{background:#f1f5f9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#4f46e5}
.btn.ghost{background:none;border-color:transparent;color:var(--accent-ink)}
.btn.ghost:hover{background:var(--accent-soft)}
/* tables */
th{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--fg-3);padding:12px 16px;border-bottom:1px solid var(--line)}
td{padding:14px 16px;font-size:13.5px;font-weight:500;border-bottom:1px solid rgba(15,23,42,.05)}
tbody tr:hover td{background:rgba(255,255,255,.55)}
/* pills, tags, badges as soft tinted pills */
.pill{padding:3px 12px;font-size:11px}
.tag{border-radius:999px;font-size:11px;padding:3px 12px;border:1px solid transparent;background:#f1f5f9;color:#64748b}
.tag.st-active,.tag.ok{background:var(--sev-pos-bg);color:var(--sev-pos);border-color:#a7f3d0}
.tag.st-expired,.tag.bad{background:var(--sev-severe-bg);color:var(--sev-severe);border-color:#fecaca}
.tag.st-suspended,.tag.warn{background:var(--sev-medium-bg);color:var(--sev-medium);border-color:#fde68a}
.rating{border-radius:999px;font-size:11px;padding:3px 12px;border:1px solid transparent;background:#f1f5f9}
.rating.r-Healthy{background:var(--sev-pos-bg);border-color:#a7f3d0;color:var(--sev-pos)}
.rating.r-AtRisk{background:var(--sev-high-bg);border-color:#fed7aa;color:var(--sev-high)}
.rating.r-Critical{background:var(--sev-severe-bg);border-color:#fecaca;color:var(--sev-severe)}
.gap{border-radius:999px}
/* rows */
.attn li,.list li,.tl li,.empty{padding-left:24px;padding-right:24px}
.legend{background:rgba(99,102,241,.05);padding-left:24px;padding-right:24px}
.tile{padding:18px 22px}.tile .v{font-size:28px;font-weight:700}
.anno{border-radius:12px}
.toast{border-radius:14px;background:#1e293b;color:#fff}
/* dummy-data blur: sections outside the risk signals scope */
.dm{position:relative;margin-bottom:20px}
.dm > .dm-body{filter:blur(6px);opacity:.7;pointer-events:none;user-select:none}
.dm > .dm-body > .section,.dm > .dm-body > .tiles,.dm > .dm-body > .cols{margin-bottom:0}
.dm-tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;background:#fff;border:1px dashed var(--line-strong);border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.4px;padding:5px 14px;color:var(--fg-3);white-space:nowrap}
.dm.top > .dm-tag{top:90px}
.dm.fact{display:block;margin:0}
.dm.fact > .dm-body{filter:blur(5px)}
.dm.fact > .dm-tag{display:none}
tr.grp td{background:rgba(99,102,241,.07);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent-ink);padding:8px 24px}
tbody tr.grp:hover td{background:rgba(99,102,241,.07)}
.cat-tbl{min-width:900px}.cat-tbl td{vertical-align:top}
.section + .anno{margin:-6px 0 20px}
details.ref > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:18px 24px;font-size:15px;font-weight:700}
details.ref > summary::-webkit-details-marker{display:none}
details.ref > summary::after{content:"▸";margin-left:auto;color:var(--fg-3)}
details.ref[open] > summary::after{content:"▾"}
details.ref[open] > summary{border-bottom:1px solid var(--line)}
.hc{padding:0}
.hc-top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:24px 24px 18px}
.hc-rate{display:flex;align-items:center;gap:18px;margin-top:8px;flex-wrap:wrap}
.rating.lg{font-size:15px;padding:6px 18px}
.hc-alert{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 24px 20px;background:var(--anno-bg);border:1px solid var(--anno-line);border-radius:14px;padding:10px 16px;font-size:13px;color:var(--anno-fg)}
.hc-svc{border-top:1px solid var(--line)}
.h-tbl{table-layout:fixed;min-width:1100px}
.h-tbl th,.h-tbl td{padding-left:12px;padding-right:12px}
.h-tbl th:first-child,.h-tbl td:first-child{padding-left:24px}
.h-tbl th:last-child,.h-tbl th:nth-child(1){width:14%}.h-tbl th:nth-child(2){width:9%}.h-tbl th:nth-child(3){width:18%}.h-tbl th:nth-child(4){width:19%}.h-tbl th:nth-child(5){width:11%}.h-tbl th:nth-child(6){width:9%}.h-tbl th:nth-child(7){width:10%}.h-tbl th:nth-child(8){width:10%}
.h-tbl .rating,.h-tbl .rel{white-space:nowrap}
.h-tbl td{vertical-align:middle;line-height:1.45;padding-top:14px;padding-bottom:14px}
.h-tbl td.svc{font-weight:700}
.h-tbl td:last-child{padding-right:20px}
.two-line{display:flex;flex-direction:column;gap:2px}

function attention(o) {
  const out = []; const sigs = orgSignals(o.id).filter(isActive);
  if (sigs.length) out.push({ text: `${sigs.length} active risk signal${sigs.length === 1 ? '' : 's'}`, page: 'risk', go: 'Review' });
  o.services.forEach(sv => { const i = SVI[sv.id], n = daysTo(sv.end), nm = SVC[sv.type].name;
    if (i.status.startsWith('Expired')) out.push({ text: `${nm}: contract ended ${fmt(sv.end)} but delivery continues`, page: 'services', go: 'Open' });
    else if (n > 0 && n <= 90 && ['Not Started', 'Follow-Up Required'].includes(i.renewal)) out.push({ text: `${nm} ends in ${n} days; renewal: ${i.renewal.toLowerCase()}`, page: 'services', go: 'Open' });
    if (i.status === 'Ready to Commence' && i.note) out.push({ text: `${nm}: ${i.note}`, page: 'services', go: 'Open' }); });
  const od = orgInv(o.id).filter(x => x.status === 'Overdue'); if (od.length) out.push({ text: `${od.length} overdue invoice${od.length === 1 ? '' : 's'} (${money(od.reduce((a, x) => a + x.amount, 0))})`, page: 'billing', go: 'Open' });
  const iss = orgIssues(o.id).filter(i => isOpenIssue(i) && i.target && D(i.target) < TODAY); if (iss.length) out.push({ text: `${iss.length} issue${iss.length === 1 ? '' : 's'} past target date`, page: 'issues', go: 'Open' });
  const ot = overdueTasks(o.id); if (ot.length) out.push({ text: `${ot.length} overdue follow-up${ot.length === 1 ? '' : 's'}: ${ot[0].text}`, page: 'activity', go: 'Open' });
  if (differs(o)) out.push({ text: `${sigs.length} active risk signal${sigs.length === 1 ? '' : 's'} but the client is rated Healthy.`, page: 'risk', go: 'Open' });
  return out;
}

const ownerOpts = o => peopleFor(o).map(p => `<option>${esc(p)}</option>`).join('');
const svcOpts = (o, sel) => `<option value="">Account-wide</option>` + o.services.map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${SVC[s.type].name}</option>`).join('');
function renderModal() {

  const o = orgById(state.org); const sig = m.sig && SIGNALS.find(x => x.id === m.sig);
  let title, fields, save;
  if (m.type === 'activity') {
    title = 'Log activity'; save = 'Save activity';
    fields = `<div class="two"><label class="f">Type<select id="mType"><option>Meeting</option><option>Call</option><option>Email</option><option>Message</option><option>Note</option></select></label><label class="f">Date<input type="date" id="mDate" value="${iso(TODAY)}"></label></div>

      <div class="two"><label class="f">Severity<select id="iSev"><option>Low</option><option selected>Medium</option><option>High</option></select></label><label class="f">Accountable owner (required)<select id="iOwner">${ownerOpts(o)}</select></label></div>
      <label class="f">Reported by<select id="iBy">${CON[o.id].map(c => `<option>${esc(c.name)} (client)</option>`).join('')}${peopleFor(o).map(p => `<option>${esc(p)} (internal)</option>`).join('')}</select></label>

      <div data-for="At Risk Critical" ${['At Risk', 'Critical'].includes(cur) ? '' : 'hidden'} style="display:grid;gap:12px"><label class="f">Reason (required)<textarea id="hReason"></textarea></label>

}
const val = id => (document.getElementById(id) || {}).value || '';
function saveModal() {
  const m = state.modal; const o = orgById(state.org); let sid_ = null, pick_ = null;
  if (m.type === 'activity') {
    const text = val('mText').trim(); if (!text) { toast('Add a summary first'); return; }
    ACT[o.id].push({ date: val('mDate') || iso(TODAY), type: val('mType'), by: who(), internal: val('mVis') === 'internal', svc: val('mSvc') || null, text });
    const fu = val('mFu').trim(); if (fu) TASKS[o.id].push({ id: nextId('T'), text: fu, owner: val('mFuOwner'), due: val('mFuDue'), done: false, svc: val('mSvc') || null });
    toast('Activity logged' + (fu ? ' with follow-up' : ''));
  } else if (m.type === 'issue') {
    const title = val('iTitle').trim(); if (!title) { toast('Add a title first'); return; }
    const id = nextId('ISS'); const sig = m.sig && SIGNALS.find(x => x.id === m.sig);
    ISSUES.push({ id, org: o.id, svc: val('iSvc') || null, title, cat: val('iCat'), sev: val('iSev'), by: val('iBy'), owner: val('iOwner'), status: 'Open', reported: iso(TODAY), target: val('iTarget') || null, sig: sig ? sig.id : null });
    if (sig) { sig.status = 'Actioned'; sig.linked = `Issue ${id} (Open)`; log(sig, `Issue ${id} created by ${who()}`); }
    toast(`Issue ${id} created, owner ${val('iOwner')}`); 
  } else {
    const pick = (document.querySelector('input[name="hr"]:checked') || {}).value; const sid = val('hScope') || null;
    const reason = val('hReason').trim(), next = val('hNext').trim(), plan = val('hPlan').trim();
    if (pick !== 'Healthy' && !reason) { toast('A reason is required for At risk or Critical'); return; }
    if (pick !== 'Healthy' && !next) { toast('A next action and owner are required'); return; }
    if (pick === 'Critical' && !plan) { toast('Critical needs a recovery owner and plan'); return; }
    sid_ = sid; pick_ = pick;
    const scope = sid ? SVC[svcById(sid).type].name : 'Client';
    const ts = nowStamp(); const due = val('hDue');
    HH[o.id].unshift({ date: iso(TODAY), time: ts.time, at: ts.at, scope, sid, level: pick, by: who(), reason: reason || 'Reassessed with no concerns', next, owner: val('hOwner'), due, plan, recOwner: val('hRecOwner') });
    if (sid) SVI[sid].health = { level: pick, on: iso(TODAY), at: ts.at, time: ts.time, reason, next, by: who(), plan, recOwner: val('hRecOwner'), due }; else { o.rating = pick; o.ratedOn = iso(TODAY); o.ratedAt = ts.at; o.ratedTime = ts.time; }
    toast(pick === 'Critical' ? `Saved. ${escText('Critical', sid)}.` : pick === 'At Risk' ? `Saved. ${escText('At Risk', sid)}.` : 'Assessment saved');
    if (m.sig) { const s = SIGNALS.find(x => x.id === m.sig); if (s && ACTIVE.includes(s.status) && s.status !== 'Actioned') { s.status = 'Actioned'; s.linked = 'Health reassessment'; log(s, `Client health reassessed as ${pick} by ${who()}`); } }
  }
  state.modal = (m.type === 'health' && sid_ && pick_ === 'Critical') ? { type: 'health', sid: null, notice: `${SVC[svcById(sid_).type].name} is now Critical. The overall client health must be assessed separately.` } : null; render();
}

      <span class="sevcell">${catTag(s.cat)}</span>
      <span class="what"><span class="t">${s.status === 'New' ? '<i class="newdot" aria-hidden="true"></i><span class="sr">New: </span>' : ''}${esc(s.title)}</span><span class="c">${esc(svcName(s.service))}${s.kind === 'condition' ? ' · Ongoing' : ''}${s.reinforced > 1 ? ` · Repeated ×${s.reinforced}` : ''}</span></span>
      <span class="meta"><span class="src">${esc(s.source)} · ${s.kind === 'event' ? fmt(s.date) : 'Since ' + fmt(s.date)}</span>${s.status === 'New' ? '' : `<span class="stpill ${s.status}">${s.status}</span>`}</span><span class="chev" aria-hidden="true">›</span>
      ${s.quote ? `<span class="q">“${esc(s.quote)}”</span>` : s.detail ? `<span class="q" style="font-style:normal">${esc(s.detail)}</span>` : ''}
    </button>`;
  const ref = (key, title, inner) => `<details class="section ref" data-ref="${key}" ${state.open[key] ? 'open' : ''}><summary>${title}</summary>${inner}</details>`;
  const nav = `<nav class="secnav" aria-label="On this page"><button data-jump="sec-health" aria-current="true">Client health</button><button data-jump="sec-sentiment" aria-current="false">Email sentiment</button><button data-jump="risk-signals" aria-current="false">Risk signals<span class="ct">${active.length}</span></button></nav>`;
  return `${nav}${healthCard(o)}${sentimentCard(o)}<section class="section" id="risk-signals">
      <header><h2>Risk signals</h2><span class="hint num">${active.length} active</span></header>
      ${active.length ? active.map(sigRow).join('') : '<div class="empty">No active risk signals.</div>'}
    </section>
    ${hist.length ? ref('hist', `Dismissed and resolved <span class="num hint">(${hist.length})</span>`, hist.map(sigRow).join('')) : ''}
    ${ref('types', `Signal types <span class="hint">· ${SIGTYPES.length} · Reference only</span>`, viewCatalogue(o))}`;
}

/* ---------- drawer ---------- */
let drawerWasOpen = false, modalWasOpen = false;
function renderDrawer() {
  const ov = document.getElementById('overlay');
  if (!state.drawer) { ov.innerHTML = ''; if (drawerWasOpen) { drawerWasOpen = false; const t = state.restore && document.querySelector(state.restore); if (t) t.focus({ preventScroll: true }); } return; }
  const s = SIGNALS.find(x => x.id === state.drawer); const o = orgById(s.org);
  const sv = s.service && svcById(s.service);
  const closed = !ACTIVE.includes(s.status);
  let foot = '';
  if (closed) foot = `<span class="hint">This signal is ${s.status.toLowerCase()}.</span><div class="row"><button class="btn sm" data-reopen="${s.id}">Reopen</button></div>`;
  else if (state.mode === 'dismiss') {
    foot = `<label for="dismissReason" class="eyebrow">Reason for dismissing (required)</label><textarea id="dismissReason" placeholder="e.g. Client confirmed on a call that this is resolved"></textarea>
      <div class="hint">Dismissed signals and reasons stay visible to the HOD.</div>
      <div class="row"><button class="btn primary sm" data-dismiss-confirm>Dismiss signal</button><button class="btn sm" data-mode="">Cancel</button></div>`;
  } else {
    const canDismiss = s.kind !== 'condition';
    const acts = [['issue', 'Create issue', 'Record it as an issue with an owner'], ['reassess', 'Reassess health', 'Update the client or service health rating']];
    foot = `<div class="eyebrow">Actions</div><div class="actmenu">${acts.map(([k, t, d]) => `<button data-act="${k}"><b>${t}</b><span>${d}</span></button>`).join('')}</div>
      <div class="row">        ${canDismiss ? '<button class="btn" data-mode="dismiss">Dismiss…</button>' : '<button class="btn" disabled title="Condition signals clear themselves">Dismiss</button>'}</div>
`;
  }
  ov.innerHTML = `<div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <header><div><div class="row">${catTag(s.cat)}<span class="src mono">${s.id}</span><span class="status ${s.status}">${s.status}</span></div><h2 id="dTitle">${esc(s.title)}</h2>
      <div class="hint">${esc(o.name)} · ${esc(svcName(s.service))}</div></div><button class="x" data-close aria-label="Close">✕</button></header>
    <div class="scroll">
      ${s.quote ? `<div><div class="eyebrow" style="margin-bottom:6px">Evidence</div><blockquote>“${esc(s.quote)}”<footer>${esc(s.source)} · ${fmt(s.date)}</footer></blockquote></div>`
      : s.detail ? `<div><div class="eyebrow" style="margin-bottom:6px">What changed</div><p style="margin:0">${esc(s.detail)}</p></div>` : ''}
      <div><div class="eyebrow" style="margin-bottom:6px">Attributed to</div>
        <dl class="kv"><dt>Organisation</dt><dd>${esc(o.name)}</dd>
        <dt>Service</dt><dd>${esc(svcName(s.service))}</dd>
        ${sv ? `<dt>Contract</dt><dd class="mono">${sv.contract} · Ends ${fmt(sv.end)}</dd><dt>Annual value</dt><dd class="num">${money(sv.value)}</dd><dt>PE</dt><dd>${esc(sv.pe)}</dd>` : ''}
        <dt>AM / rating</dt><dd>${esc(o.am)} · ${esc(hl(o.rating))} (${fmt(o.ratedOn)})</dd>
        ${s.linked ? `<dt>Linked to</dt><dd>${esc(s.linked)}</dd>` : ''}
        ${s.dismissReason ? `<dt>Dismissed because</dt><dd>${esc(s.dismissReason)}</dd>` : ''}</dl></div>
      <div><div class="eyebrow" style="margin-bottom:6px">Signal history</div><ul class="hist">${(s.history.length ? s.history : [{ d: s.date, t: 'Detected' }]).map(h => `<li><span class="when">${fmt(h.d)}</span><span>${esc(h.t)}</span></li>`).join('')}</ul></div>
    </div>
    <div class="foot">${foot}</div>
  </aside>`;
  if (!drawerWasOpen) { drawerWasOpen = true; const x = ov.querySelector('.drawer .x'); if (x) x.focus({ preventScroll: true }); }
}

/* ---------- actions ---------- */
let toastTimer;
function toast(msg) {
  const h = document.getElementById('toastHost'); h.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => h.innerHTML = '', 3200);
}
const who = () => ME;
const log = (s, t) => s.history.push({ d: iso(TODAY), t });
function openSig(id, orgId) {
  const s = SIGNALS.find(x => x.id === id); if (!s) return;
  state.org = orgId || s.org; state.page = 'risk'; state.drawer = id; state.mode = null; state.restore = `[data-open-sig="${id}"]`;
  render();
}
function nextId(p) { return p + '-' + (1043 + Math.floor(Math.random() * 900)); }

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open-org], [data-close], [data-open-sig]'); if (!t) return;
  const d = t.dataset;
  if (d.jump) { const el = document.getElementById(d.jump); if (el) el.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); setTimeout(updateSpy, 120); setTimeout(updateSpy, 700); return; }
  if (d.page) { state.page = d.page; state.scrollTo = d.scroll || null; render(); return; }
  if (d.modal) { state.restoreModal = `[data-modal="${d.modal}"]${d.sid ? `[data-sid="${d.sid}"]` : ''}`; state.modal = { type: d.modal, sid: d.sid || null }; renderModal(); return; }
  if ('modalClose' in d) { state.modal = null; renderModal(); return; }
  if ('modalSave' in d) { saveModal(); return; }
  if (d.openSig) { openSig(d.openSig, d.org); return; }
  if ('close' in d) { state.drawer = null; state.mode = null; render(); return; }
  if (d.gran) { state.sentGran = d.gran; state.sentSel = null; render(); return; }
  if (d.cell) { state.sentSel = d.cell; render(); return; }
  if (d.source) { state.src = d.source; render(); return; }
  if (d.cf) { const [g, v] = d.cf.split(':'); state.catFilter[g] = v; render(); return; }
  if ('mode' in d) { state.mode = d.mode || null; renderDrawer(); return; }
  const s = state.drawer && SIGNALS.find(x => x.id === state.drawer);
  if (d.act && s) {
    if (d.act === 'reassess') { state.drawer = null; state.mode = null; state.modal = { type: 'health', sig: s.id }; render(); return; }
    if (d.act === 'issue') { state.modal = { type: 'issue', sig: s.id }; renderModal(); return; }
  }
  if ('dismissConfirm' in d && s) {
    const r = document.getElementById('dismissReason').value.trim();
    if (!r) { toast('Add a reason before dismissing'); document.getElementById('dismissReason').focus(); return; }
    s.status = 'Dismissed'; s.dismissReason = r; log(s, `Dismissed by ${who()}: "${r}"`);
    toast('Signal dismissed. Reason visible to HOD.'); state.mode = null; state.drawer = null; render(); return;
  }
  if (d.reopen) { const x = SIGNALS.find(y => y.id === d.reopen); x.status = 'New'; x.dismissReason = null; log(x, 'Reopened by ' + who()); toast('Signal reopened'); render(); return; }
});
document.addEventListener('change', e => {
  if (e.target.name === 'hr') document.querySelectorAll('.modal [data-for]').forEach(x => { const f = x.dataset.for; x.hidden = !(f === 'Critical' ? e.target.value === 'Critical' : e.target.value !== 'Healthy'); });
});
document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.ref; if (k) state.open[k] = e.target.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.modal) { state.modal = null; renderModal(); return; }
  if (e.key === 'Escape' && state.drawer) { state.drawer = null; state.mode = null; render(); } });

state.org = 'abc';
render();
</script>

</body></html>
